Description=The summon gauge shows each summon's HP, "Out of range", a warning pulse at low HP and how many summons are out. Switch: Options > UI > Add-ons.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=Fixed the "Could not retrieve element in view, was it destroyed?" warnings: the look that isn't in use is now hidden instead of taken out of the window.
Priority=5
